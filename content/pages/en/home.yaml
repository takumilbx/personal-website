about:
  heading: "About me"
  # Owner direction 2026-09-26: many roles, one thread (education made accessible). Draft A; alternative B below.
  paragraph: "I translate between Thai and Japanese, research classrooms in Tokyo and Bangkok, make TikToks about Japan, and helped take an EdTech startup into four countries. It looks like four jobs. It's really one: taking something hard to reach, a Japanese fact, a better lesson, a chance to learn, and making it easier to get to."
  # Alternative B: "Translator, researcher, creator, business developer. Four titles, one thread: I want learning to be within reach. A hard Japanese fact explained so anyone can follow it, a classroom that actually changes, an opportunity that exists because a business made it possible."
  cta: { label: "Contact me", href: "/en/contact/" }   # default (Q12): the contact page, not a mailto

services:
  heading: "What I do"                # default (Q9)
  items:                              # default (Q9): five items from the CV, one sentence each
    - name: "Education research"
      description: "Classroom observation and teacher interviews on one-device-per-student programmes, comparing Japan's GIGA School with Bangkok's Digital Classroom."
    - name: "Policy analysis and data"
      description: "From 47 municipal policies sorted into 8 focus areas to 10,849 public submissions read with NLP, for the Bangkok Metropolitan Administration."
    - name: "EdTech market entry"
      description: "Regulatory and competitive analysis, pilot-school lists, and curriculum-matched demo lessons that took Edsy into Japan, Korea, Turkey and Saudi Arabia."
    - name: "Interpreting and translation"
      description: "Simultaneous Japanese, Thai and English interpreting at international summits, and field support for four cohorts of Japanese students in Thailand."
    - name: "Film, photography and content"
      description: "Event films and short-form content for UNDP Thailand, UNICEF Thailand and others, and the @takumyi channel explaining Japan to a Thai audience."

