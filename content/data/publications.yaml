publications:
  - title: "Expert Teachers' ICT Decisions in 1:1 Classrooms: A Japan–Bangkok Comparison"
    authors: ["Oshiyama, T."]
    venue: "Master's thesis, Graduate School of Interdisciplinary Information Studies, The University of Tokyo"
    year: 2027
    type: thesis
    status: in-progress
    start: "2025-10"
    expected: "2027-09"
    supervisor: Prof. Yuhei Yamauchi
    url: ""
    pdf: ""
    abstract: "Studies how expert teachers in ChromebookOS classrooms decide to use, adapt, or withhold technology under Japan's GIGA School programme and Bangkok's Digital Classroom project, through observation and Japanese-language interviews with expert-nominated teachers."
    notes: "Title as given in the résumé; the CV gives it as 'Contextual Knowledge and ICT Decisions in One-Device-Per-Student Classrooms'. Year is the expected completion; research conducted at YLab (Yamauchi Lab)."
  - title: "Strengthening the labour force participation of older persons in the context of digital transformation and the fourth industrial revolution — insights from the Asia-Pacific region"
    authors: ["McFarlane, D.", "Mieruch, Y.", "Ruedreal, T."]
