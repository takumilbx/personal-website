    date: "2024-12-02"
    type: report
    url: https://repository.unescap.org/items/b60ffa94
    pdf: ""
    abstract: "Contributed the country case studies on Japan, Korea and China, covering national initiatives that improve older people's digital literacy and inclusion, to a regional report on labour-force participation under digital transformation."
    notes: "Credited as Ruedreal, T."
  - title: "Comparative Analysis of Bangkok's Digital Classroom Policy and Japan's GIGA School Program"
    authors: ["Oshiyama, T."]
    venue: "Senior thesis, School of Global Studies, Thammasat University"
    year: 2024
    type: thesis
    advisor: Dr. Shekh Mohammad Altafur Rahman
    url: ""
    pdf: ""
    abstract: "Compares two one-device-per-student initiatives, with field data from a Bangkok Metropolitan Administration school and the Japanese case built from policy documentation, and identifies three recurring barriers to ICT implementation: uneven teacher digital skills, slow connectivity, and parental concern about efficacy."
    notes: "Graded A across both terms (2023 to 2024)."
