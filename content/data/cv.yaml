research:
  - title: "Expert Teachers' ICT Decisions in 1:1 Classrooms: A Japan–Bangkok Comparison"
    institution: "University of Tokyo, Graduate School of Interdisciplinary Information Studies (YLab, Prof. Yuhei Yamauchi)"
    start: "2025-10"
    end: present
    supervisor: Prof. Yuhei Yamauchi
    summary: "Master's thesis. Investigated why one-device-per-student rollouts do not convert into classroom use, comparing Japan's GIGA School Program with Bangkok's Digital Classroom policy across two education systems. Conducted classroom observation and semi-structured teacher interviews through recurring fieldwork visits to Japanese schools, set against comparative analysis of both education systems."
    notes: "Title as given in the résumé; the CV gives it as 'Contextual Knowledge and ICT Decisions in One-Device-Per-Student Classrooms'."
  - title: "Research Assistant, Strengthening the Labour Force Participation of Older Persons"
    institution: United Nations ESCAP
    start: "2024"
    end: "2024"
    summary: "Sourced and wrote country case studies across Japan, Korea and China on national initiatives improving older people's digital literacy and inclusion, for an ESCAP report on labour-force participation under digital transformation. Worked under the mentorship of the report's lead consultant; named as a contributor in the published paper, released through the ESCAP repository in December 2024."
  - title: "Comparative Analysis of Bangkok's Digital Classroom Policy and Japan's GIGA School Program"
    institution: "Thammasat University, School of Global Studies"
    start: "2023"
    end: "2024"
    advisor: Dr. Shekh Mohammad Altafur Rahman
    summary: "Senior thesis. Compared two one-device-per-student initiatives, collecting field data at a Bangkok Metropolitan Administration school and building the Japanese case from policy documentation. Identified three recurring barriers to ICT implementation in both contexts, including uneven teacher digital skills, slow connectivity, and parental concern about efficacy, and concluded that device programmes must address students, teachers, parents and the learning environment together. Graded A across both terms."
  - title: Educational Policy Research Fieldwork
    institution: Thailand Development Research Institute (TDRI)
    start: "2019-08"
    end: "2019-08"
    location: Bangkok
    summary: "Shadowed a senior researcher on TDRI's education team through fieldwork evaluating an ICT-in-education policy in a rural school, practising observation, interviewing, analysis and report writing."

